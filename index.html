<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>vLLM-Ascend CI Monitor</title>
<meta name="description" content="Hourly passive availability monitor for public vLLM-Ascend GitHub Actions CI.">
<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,rgba(49,87,213,.11),transparent 34rem),var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.wrap{max-width:1180px;margin:auto;padding:28px 20px 56px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}h1{font-size:25px;line-height:1.2;margin:0 0 5px}h2{font-size:16px;margin:0 0 14px}h3{font-size:15px;margin:0 0 7px}.muted{color:var(--muted)}.tools{display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--card);color:var(--text);cursor:pointer}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 20px}.tab{appearance:none;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font:inherit;font-weight:650;padding:10px 14px;cursor:pointer}.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.status{grid-column:span 5}.today{grid-column:span 7}.wide{grid-column:1/-1}.big-status{display:flex;align-items:center;gap:12px;margin:12px 0 14px}.dot{width:18px;height:18px;border-radius:50%;flex:none}.dot.healthy,.hour.healthy{background:var(--ok)}.dot.down,.hour.down{background:var(--bad)}.dot.degraded,.hour.degraded{background:var(--warn)}.dot.unknown,.hour.unknown{background:var(--unk)}.status-text{font-size:29px;font-weight:750;letter-spacing:-.03em}.meta{display:flex;flex-wrap:wrap;gap:7px 18px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{border-left:2px solid var(--line);padding-left:12px}.metric strong{display:block;font-size:22px}.metric span{font-size:12px;color:var(--muted)}.timeline{display:grid;grid-template-columns:repeat(24,minmax(9px,1fr));gap:4px}.hour{height:35px;border-radius:5px;cursor:default;transition:.12s}.hour:hover{transform:translateY(-2px)}.hlabel{text-align:center;font-size:10px;color:var(--muted);margin-top:5px}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:12px}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}.incident{display:grid;grid-template-columns:170px 105px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}.incident:first-child{border-top:0;padding-top:0}.pill{display:inline-flex;width:fit-content;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700}.pill.healthy,.decision.good{color:var(--ok);background:var(--okbg)}.pill.down,.decision.bad{color:var(--bad);background:var(--badbg)}.pill.degraded{color:var(--warn);background:var(--warnbg)}.pill.unknown,.decision.unknown{color:var(--unk);background:var(--unkbg)}.table-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:10px}.search{width:min(350px,100%);padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:10px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}td code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}.error{display:none;border:1px solid var(--bad);background:var(--badbg);color:var(--bad);padding:12px;border-radius:10px;margin-bottom:14px}.policy-hero{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.hero-box{border-radius:14px;padding:18px;border:1px solid var(--line)}.hero-box. </head>
<body>
<main class="wrap">
<header><div><h1>vLLM-Ascend CI Monitor</h1><div class="muted" data-i18n="subtitle"></div></div><div class="tools"><a class="btn" href="https://github.com/vllm-project/vllm-ascend/actions" target="_blank" rel="noreferrer" data-i18n="upstream"></a><button id="lang" class="btn"></button></div></header>
<nav class="tabs" aria-label="Dashboard tabs"><button class="tab active" data-tab="overview" data-i18n="tabOverview"></button><button class="tab" data-tab="policy" data-i18n="tabPolicy"></button></nav>
<div id="error" class="error"></div>
<section id="overviewPanel" class="panel active">
<div class="grid">
<article class="card status"><h2 data-i18n="latest"></h2><div class="big-status"><span id="dot" class="dot unknown"></span><span id="status" class="status-text">UNKNOWN</span></div><div id="meta" class="meta"></div></article>
<article class="card today"><h2 data-i18n="today"></h2><div class="metrics"><div class="metric"><strong id="availability">—</strong><span data-i18n="availability"></span></div><div class="metric"><strong id="healthyHours">—</strong><span data-i18n="healthyHours"></span></div><div class="metric"><strong id="badHours">—</strong><span data-i18n="badHours"></span></div><div class="metric"><strong id="coverage">—</strong><span data-i18n="coverage"></span></div></div></article>
<article class="card wide"><h2 data-i18n="timelineTitle"></h2><div id="timeline" class="timeline"></div><div class="legend"><span><i style="background:var(--ok)"></i><b data-i18n="healthy"></b></span><span><i style="background:var(--bad)"></i><b data-i18n="down"></b></span><span><i style="background:var(--warn)"></i><b data-i18n="degraded"></b></span><span><i style="background:var(--unk)"></i><b data-i18n="unknown"></b></span></div></article>
<article class="card wide"><h2 data-i18n="incidents"></h2><div id="incidents"></div></article>
<article class="card wide"><div class="table-head"><div><h2 style="margin-bottom:2px" data-i18n="checks"></h2><div id="checkSummary" class="muted"></div></div><input id="search" class="search" type="search" data-i18n-placeholder="search"></div><div class="table-wrap"><table><thead><tr><th data-i18n="state"></th><th data-i18n="kind"></th><th>Workflow</th><th>Job / Check</th><th data-i18n="samples"></th><th data-i18n="passRate"></th><th data-i18n="basis"></th></tr></thead><tbody id="tbody"></tbody></table></div></article>
</div>
</section>
<section id="policyPanel" class="panel">
<div class="policy-intro"><h2 data-i18n="policyTitle"></h2><div data-i18n="policyIntro"></div></div>
<div class="policy-hero"><div class="hero-box good"><strong data-i18n="validVerdictTitle"></strong><span data-i18n="validVerdictBody"></span></div><div class="hero-box bad"><strong data-i18n="unavailableTitle"></strong><span data-i18n="unavailableBody"></span></div></div>
<article class="card policy-table"><div class="table-head"><div><h2 style="margin-bottom:2px" data-i18n="policyTableTitle"></h2><div class="muted" data-i18n="policyTableSub"></div></div></div><div class="table-wrap"><table><thead><tr><th data-i18n="scenario"></th><th data-i18n="example"></th><th data-i18n="decision"></th><th data-i18n="why"></th></tr></thead><tbody id="policyBody"></tbody></table></div><div class="footnote" data-i18n="policyFootnote"></div></article>
</section>
<footer><span id="updated"></span><span>·</span><a href="https://github.com/freyfwt/vllm-ascend-ci-monitor" target="_blank" rel="noreferrer">freyfwt/vllm-ascend-ci-monitor</a><span>·</span><span data-i18n="disclaimer"></span></footer>
</main>

['普通测试/断言失败','pytest、unittest、AssertionError、功能回归','good','测试稳定地指出 PR 问题，CI 本身可用'],

function renderToday(hours){const n=new Date(),today=dateKey(n),rows=hours.filter(x=>dateKey(new Date(x.hour))===today),c={healthy:0,down:0,degraded:0,unknown:0};rows.forEach(x=>c[x.status]=(c[x.status]||0)+1);const observed=c.healthy+c.down+c.degraded;$('availability').textContent=observed?pct(c.healthy/observed):'—';$('healthyHours').textContent=`${c.healthy}h`;$('badHours').textContent=`${c.down+c.degraded}h`;$('coverage').textContent=n.getHours()?pct(observed/n.getHours()):'—'}
function renderTimeline(hours){const map=new Map(hours.map(x=>[x.hour,x])),latest=hours.length?new Date(hours.at(-1).hour):new Date(Date.now()-3600e3),rows=[];for(let i=23;i>=0;i--){const d=new Date(latest.getTime()-i*3600e3),k=hourKey(d);rows.push(map.get(k)||{hour:k,status:'unknown'})}$('timeline').innerHTML=rows.map(x=>{const title=`${fmt(x.hour)} | ${statusLabel(x.status)} | ${t('runs')}: ${x.runs||0} | ${t('infra')}: ${infraCount(x)} | ${t('codeVerdicts')}: ${codeCount(x)} | ${t('prob')}: ${probCount(x)} | ${t('unresolved')}: ${unresolvedCount(x)}`;return `<div><div class="hour ${x.status||'unknown'}" title="${esc(title)}"></div><div class="hlabel">${hfmt(x.hour)}</div></div>`}).join('')}
function incidents(hours){const cutoff=Date.now()-7*864e5,bad=hours.filter(x=>new Date(x.hour).getTime()>=cutoff&&['down','degraded'].includes(x.status)),out=[];let cur=null;for(const x of bad){const ms=new Date(x.hour).getTime();if(!cur||ms-cur.last!==3600e3){cur={start:x.hour,end:new Date(ms+3600e3).toISOString(),last:ms,rows:[x]};out.push(cur)}else{cur.end=new Date(ms+3600e3).toISOString();cur.last=ms;cur.rows.push(x)}}return out.reverse().slice(0,10)}
function renderIncidents(hours){const a=incidents(hours);if(!a.length){$('incidents').innerHTML=`<div class="muted">${esc(t('noIncidents'))}</div>`;return}$('incidents').innerHTML=a.map(z=>{const s=z.rows.some(x=>x.status==='down')?'down':'degraded',f=z.rows.reduce((n,x)=>n+infraCount(x),0),p=z.rows.reduce((n,x)=>n+probCount(x),0),r={};z.rows.forEach(x=>Object.entries(x.reasons||{}).forEach(([k,v])=>r[k]=(r[k]||0)+v));const rs=Object.entries(r).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} × ${v}`).join(' · ')||t('none');return `<div class="incident"><div><strong>${esc(fmt(z.start))}</strong><div class="muted">→ ${esc(fmt(z.end))}</div></div><div><span class="pill ${s}">${esc(statusLabel(s))}</span></div><div>${esc(t('incident')(f,p))}<div class="muted">${esc(rs)}</div></div></div>`}).join('')}
function probReason(x){return x.probability_reason?t(x.probability_reason):t('none')}function renderChecks(){const all=Object.values(T?.tests||{}),q=$('search').value.trim().toLowerCase(),rows=all.filter(x=>`${x.workflow} ${x.name} ${x.kind}`.toLowerCase().includes(q));$('checkSummary').textContent=t('summary')(all.length,all.filter(x=>x.probabilistic).length);$('tbody').innerHTML=rows.slice(0,500).map(x=>`<tr><td><span class="pill ${x.probabilistic?'down':'healthy'}">${esc(x.probabilistic?t('probState'):t('normalState'))}</span></td><td>${esc(x.kind==='workflow'?t('workflow'):t('job'))}</td><td>${esc(x.workflow||'—')}</td><td><code>${esc(x.name||'—')}</code></td><td>${x.samples_30d??0}</td><td>${pct(x.pass_rate_30d)}</td><td>${esc(probReason(x))}</td></tr>`).join('')}
function renderPolicy(){if(!$('policyBody'))return;$('policyBody').innerHTML=POLICY[lang].map(([s,e,d,w])=>{const label=d==='bad'?t('decisionDown'):d==='good'?t('decisionValid'):t('decisionUnknown');return `<tr><td>${esc(s)}</td><td>${esc(e)}</td><td><span class="decision ${d}">${esc(label)}</span></td><td>${esc(w)}</td></tr>`}).join('')}
function render(){i18n();const hours=[...(H?.hours||[])].sort((a,b)=>a.hour.localeCompare(b.hour));renderCurrent(hours);renderToday(hours);renderTimeline(hours);renderIncidents(hours);renderChecks();$('updated').textContent=`${t('updated')}: ${H?.updated_at?fmt(H.updated_at):'—'}`;setTab(activeTab)}
async function load(){try{const s=Date.now();[H,T]=await Promise.all([fetch(`data/history.json?t=${s}`).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),fetch(`data/tests.json?t=${s}`).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})]);$('error').style.display='none';render()}catch(e){console.error(e);$('error').textContent=t('loadError');$('error').style.display='block'}}
$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('lang',lang);render()};$('search').oninput=renderChecks;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));window.addEventListener('hashchange',()=>setTab(location.hash==='#policy'?'policy':'overview'));i18n();setTab(activeTab);load();
</script>
</body>
