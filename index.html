<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>vLLM-Ascend CI Monitor</title>
<meta name="description" content="Hourly passive availability monitor for public vLLM-Ascend GitHub Actions CI.">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--ok:#159455;--bad:#d92d20;--warn:#d97706;--unk:#98a2b3;--accent:#3157d5;--okbg:#eaf8f0;--badbg:#fff0ee;--warnbg:#fff7df;--unkbg:#f2f4f7;--shadow:0 10px 30px rgba(16,24,40,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--text:#f0f3f6;--muted:#8b949e;--line:#30363d;--accent:#7aa2ff;--okbg:rgba(35,134,54,.16);--badbg:rgba(248,81,73,.15);--warnbg:rgba(210,153,34,.15);--unkbg:#21262d;--shadow:none}}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,rgba(49,87,213,.11),transparent 34rem),var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.wrap{max-width:1180px;margin:auto;padding:28px 20px 56px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}h1{font-size:25px;line-height:1.2;margin:0 0 5px}h2{font-size:16px;margin:0 0 14px}.muted{color:var(--muted)}.tools{display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--card);color:var(--text);cursor:pointer}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.status{grid-column:span 5}.today{grid-column:span 7}.wide{grid-column:1/-1}.big-status{display:flex;align-items:center;gap:12px;margin:12px 0 14px}.dot{width:18px;height:18px;border-radius:50%;flex:none}.dot.healthy,.hour.healthy{background:var(--ok)}.dot.down,.hour.down{background:var(--bad)}.dot.degraded,.hour.degraded{background:var(--warn)}.dot.unknown,.hour.unknown{background:var(--unk)}.status-text{font-size:29px;font-weight:750;letter-spacing:-.03em}.meta{display:flex;flex-wrap:wrap;gap:7px 18px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{border-left:2px solid var(--line);padding-left:12px}.metric strong{display:block;font-size:22px}.metric span{font-size:12px;color:var(--muted)}.timeline{display:grid;grid-template-columns:repeat(24,minmax(9px,1fr));gap:4px}.hour{height:35px;border-radius:5px;cursor:default;transition:.12s}.hour:hover{transform:translateY(-2px)}.hlabel{text-align:center;font-size:10px;color:var(--muted);margin-top:5px}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:12px}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}.incident{display:grid;grid-template-columns:170px 105px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}.incident:first-child{border-top:0;padding-top:0}.pill{display:inline-flex;width:fit-content;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700}.pill.healthy{color:var(--ok);background:var(--okbg)}.pill.down{color:var(--bad);background:var(--badbg)}.pill.degraded{color:var(--warn);background:var(--warnbg)}.pill.unknown{color:var(--unk);background:var(--unkbg)}.table-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:10px}.search{width:min(350px,100%);padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:10px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}td code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}.policies{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.policy{padding:12px;border-radius:10px;background:var(--unkbg)}.policy strong{display:block;margin-bottom:4px}.error{display:none;border:1px solid var(--bad);background:var(--badbg);color:var(--bad);padding:12px;border-radius:10px;margin-bottom:14px}footer{margin-top:20px;color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap}@media(max-width:820px){.status,.today{grid-column:1/-1}.metrics{grid-template-columns:repeat(2,1fr)}.incident{grid-template-columns:1fr;gap:5px}.policies{grid-template-columns:1fr}header{align-items:stretch}.tools{flex-direction:column}}
</style>
</head>
<body>
<main class="wrap">
<header><div><h1>vLLM-Ascend CI Monitor</h1><div class="muted" data-i18n="subtitle"></div></div><div class="tools"><a class="btn" href="https://github.com/vllm-project/vllm-ascend/actions" target="_blank" rel="noreferrer" data-i18n="upstream"></a><button id="lang" class="btn"></button></div></header>
<div id="error" class="error"></div>
<section class="grid">
<article class="card status"><h2 data-i18n="latest"></h2><div class="big-status"><span id="dot" class="dot unknown"></span><span id="status" class="status-text">UNKNOWN</span></div><div id="meta" class="meta"></div></article>
<article class="card today"><h2 data-i18n="today"></h2><div class="metrics"><div class="metric"><strong id="availability">—</strong><span data-i18n="availability"></span></div><div class="metric"><strong id="healthyHours">—</strong><span data-i18n="healthyHours"></span></div><div class="metric"><strong id="badHours">—</strong><span data-i18n="badHours"></span></div><div class="metric"><strong id="coverage">—</strong><span data-i18n="coverage"></span></div></div></article>
<article class="card wide"><h2 data-i18n="timelineTitle"></h2><div id="timeline" class="timeline"></div><div class="legend"><span><i style="background:var(--ok)"></i><b data-i18n="healthy"></b></span><span><i style="background:var(--bad)"></i><b data-i18n="down"></b></span><span><i style="background:var(--warn)"></i><b data-i18n="degraded"></b></span><span><i style="background:var(--unk)"></i><b data-i18n="unknown"></b></span></div></article>
<article class="card wide"><h2 data-i18n="incidents"></h2><div id="incidents"></div></article>
<article class="card wide"><div class="table-head"><div><h2 style="margin-bottom:2px" data-i18n="checks"></h2><div id="checkSummary" class="muted"></div></div><input id="search" class="search" type="search" data-i18n-placeholder="search"></div><div class="table-wrap"><table><thead><tr><th data-i18n="state"></th><th data-i18n="kind"></th><th>Workflow</th><th>Job / Check</th><th data-i18n="samples"></th><th data-i18n="passRate"></th><th data-i18n="basis"></th></tr></thead><tbody id="tbody"></tbody></table></div></article>
<article class="card wide"><h2 data-i18n="policyTitle"></h2><div class="policies"><div class="policy"><strong data-i18n="p1t"></strong><span class="muted" data-i18n="p1"></span></div><div class="policy"><strong data-i18n="p2t"></strong><span class="muted" data-i18n="p2"></span></div><div class="policy"><strong data-i18n="p3t"></strong><span class="muted" data-i18n="p3"></span></div></div></article>
</section>
<footer><span id="updated"></span><span>·</span><a href="https://github.com/freyfwt/vllm-ascend-ci-monitor" target="_blank" rel="noreferrer">freyfwt/vllm-ascend-ci-monitor</a><span>·</span><span data-i18n="disclaimer"></span></footer>
</main>
<script>
const L={zh:{subtitle:'公开 GitHub Actions 的每小时被动可用性监控',upstream:'上游 CI',latest:'最近完整小时状态',today:'今日统计',availability:'已观测可用率',healthyHours:'可用小时',badHours:'不可用小时',coverage:'观测覆盖率',timelineTitle:'最近 24 个完整小时',healthy:'可用',down:'不可用',degraded:'降级',unknown:'未知',incidents:'近期不可用区间',checks:'所有已观测 CI 检查',search:'搜索 workflow / job',state:'状态',kind:'类型',samples:'30 天样本',passRate:'30 天通过率',basis:'判定依据',policyTitle:'当前监控口径',p1t:'任意实际 CI 失败 = 不可用',p1:'实际构建/测试 workflow 或 job 只要不是 success / neutral / skipped，对应小时记为不可用；仓库管理机器人流程不纳入。',p2t:'概率敏感用例出现 = 不可用',p2:'performance / accuracy / acceptance / benchmark / eval 等概率敏感测试，或同一 commit 出现 PASS/FAIL 的 job，只要出现在该小时，即使本次成功或被跳过，也记为不可用。',p3t:'证据不足不冒充可用',p3:'没有 CI 活动或公开 API 覆盖不完整时记为 Unknown，并从已观测可用率分母排除。',disclaimer:'公开 CI 活动的被动观测，不代表 vLLM-Ascend 官方 SLA。',updated:'数据更新时间',runs:'Runs',jobs:'Jobs',failures:'失败信号',prob:'概率敏感 Jobs',partial:'API 覆盖不完整',noData:'尚无监控数据。',noIncidents:'最近没有观测到不可用区间。',loadError:'数据加载失败，请检查 GitHub Actions。',probState:'概率敏感',normalState:'未标记概率性',workflow:'Workflow',job:'Job',policy_probability_sensitive:'策略：性能/精度/采信/评测类',same_commit_mixed_outcomes:'同一 commit 出现 PASS/FAIL',none:'—',summary:(a,p)=>`已观测 ${a} 个检查，其中 ${p} 个标记为概率敏感`,incident:(f,p)=>`${f} 个失败信号 · ${p} 个概率敏感 job`},en:{subtitle:'Hourly passive availability monitoring of public GitHub Actions',upstream:'Upstream CI',latest:'Latest completed-hour status',today:'Today',availability:'Observed availability',healthyHours:'Available hours',badHours:'Unavailable hours',coverage:'Observed coverage',timelineTitle:'Last 24 completed hours',healthy:'Healthy',down:'Unavailable',degraded:'Degraded',unknown:'Unknown',incidents:'Recent unavailable intervals',checks:'All observed CI checks',search:'Search workflow / job',state:'State',kind:'Kind',samples:'30d samples',passRate:'30d pass rate',basis:'Detection basis',policyTitle:'Monitoring policy',p1t:'Any real CI failure = unavailable',p1:'Any real build/test workflow or job outside success / neutral / skipped marks the hour unavailable. Repository housekeeping bots are excluded.',p2t:'Probability-sensitive job present = unavailable',p2:'Performance, accuracy, acceptance, benchmark or eval jobs, plus jobs observed PASS/FAIL on the same commit, make the hour unavailable whenever present, even when that occurrence passes or is skipped.',p3t:'Unknown is never called healthy',p3:'Hours without CI evidence or with partial public-API coverage are Unknown and excluded from observed availability.',disclaimer:'Passive observation of public CI activity; this is not the official vLLM-Ascend SLA.',updated:'Data updated',runs:'Runs',jobs:'Jobs',failures:'Failure signals',prob:'Probability-sensitive jobs',partial:'Partial API coverage',noData:'No monitoring data yet.',noIncidents:'No unavailable interval observed recently.',loadError:'Failed to load data. Check GitHub Actions.',probState:'Probability-sensitive',normalState:'No probability flag',workflow:'Workflow',job:'Job',policy_probability_sensitive:'Policy: performance / accuracy / acceptance / eval',same_commit_mixed_outcomes:'Same commit produced PASS and FAIL',none:'—',summary:(a,p)=>`${a} observed checks; ${p} marked probability-sensitive`,incident:(f,p)=>`${f} failure signals · ${p} probability-sensitive jobs`}};
let lang=localStorage.getItem('lang')||(navigator.language.startsWith('zh')?'zh':'en'),H=null,T=null;const $=id=>document.getElementById(id),t=k=>L[lang][k]??k;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function pct(v){return v==null||Number.isNaN(v)?'—':`${(v*100).toFixed(1)}%`}function pad(n){return String(n).padStart(2,'0')}function dateKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function hourKey(d){return d.toISOString().slice(0,13)+':00:00Z'}function fmt(iso){return new Intl.DateTimeFormat(lang==='zh'?'zh-CN':'en-GB',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso))}function hfmt(iso){return pad(new Date(iso).getHours())}function statusLabel(s){return t(s||'unknown')}function failureCount(h){return (h.failed_runs||0)+(h.failed_jobs||0)}function probCount(h){return (h.probabilistic_workflows||0)+(h.probabilistic_jobs||0)}
function i18n(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(e=>{const v=t(e.dataset.i18n);if(typeof v==='string')e.textContent=v});document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=t(e.dataset.i18nPlaceholder));$('lang').textContent=lang==='zh'?'EN':'中文'}
function renderCurrent(hours){const x=hours.at(-1);if(!x){$('status').textContent='UNKNOWN';$('meta').textContent=t('noData');return}$('dot').className=`dot ${x.status||'unknown'}`;$('status').textContent=statusLabel(x.status).toUpperCase();const a=[fmt(x.hour),`${t('runs')}: ${x.runs||0}`,`${t('jobs')}: ${x.jobs||0}`,`${t('failures')}: ${failureCount(x)}`,`${t('prob')}: ${probCount(x)}`];if(x.coverage==='partial')a.push(t('partial'));$('meta').innerHTML=a.map(v=>`<span>${esc(v)}</span>`).join('')}
function renderToday(hours){const n=new Date(),today=dateKey(n),rows=hours.filter(x=>dateKey(new Date(x.hour))===today),c={healthy:0,down:0,degraded:0,unknown:0};rows.forEach(x=>c[x.status]=(c[x.status]||0)+1);const observed=c.healthy+c.down+c.degraded;$('availability').textContent=observed?pct(c.healthy/observed):'—';$('healthyHours').textContent=`${c.healthy}h`;$('badHours').textContent=`${c.down+c.degraded}h`;$('coverage').textContent=n.getHours()?pct(observed/n.getHours()):'—'}
function renderTimeline(hours){const map=new Map(hours.map(x=>[x.hour,x])),latest=hours.length?new Date(hours.at(-1).hour):new Date(Date.now()-3600e3),rows=[];for(let i=23;i>=0;i--){const d=new Date(latest.getTime()-i*3600e3),k=hourKey(d);rows.push(map.get(k)||{hour:k,status:'unknown'})}$('timeline').innerHTML=rows.map(x=>{const title=`${fmt(x.hour)} | ${statusLabel(x.status)} | ${t('runs')}: ${x.runs||0} | ${t('failures')}: ${failureCount(x)} | ${t('prob')}: ${probCount(x)}`;return `<div><div class="hour ${x.status||'unknown'}" title="${esc(title)}"></div><div class="hlabel">${hfmt(x.hour)}</div></div>`}).join('')}
function incidents(hours){const cutoff=Date.now()-7*864e5,bad=hours.filter(x=>new Date(x.hour).getTime()>=cutoff&&['down','degraded'].includes(x.status)),out=[];let cur=null;for(const x of bad){const ms=new Date(x.hour).getTime();if(!cur||ms-cur.last!==3600e3){cur={start:x.hour,end:new Date(ms+3600e3).toISOString(),last:ms,rows:[x]};out.push(cur)}else{cur.end=new Date(ms+3600e3).toISOString();cur.last=ms;cur.rows.push(x)}}return out.reverse().slice(0,10)}
function renderIncidents(hours){const a=incidents(hours);if(!a.length){$('incidents').innerHTML=`<div class="muted">${esc(t('noIncidents'))}</div>`;return}$('incidents').innerHTML=a.map(z=>{const s=z.rows.some(x=>x.status==='down')?'down':'degraded',f=z.rows.reduce((n,x)=>n+failureCount(x),0),p=z.rows.reduce((n,x)=>n+probCount(x),0),r={};z.rows.forEach(x=>Object.entries(x.reasons||{}).forEach(([k,v])=>r[k]=(r[k]||0)+v));const rs=Object.entries(r).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} × ${v}`).join(' · ')||t('none');return `<div class="incident"><div><strong>${esc(fmt(z.start))}</strong><div class="muted">→ ${esc(fmt(z.end))}</div></div><div><span class="pill ${s}">${esc(statusLabel(s))}</span></div><div>${esc(t('incident')(f,p))}<div class="muted">${esc(rs)}</div></div></div>`}).join('')}
function reason(x){return x.probability_reason?t(x.probability_reason):t('none')}function renderChecks(){const all=Object.values(T?.tests||{}),q=$('search').value.trim().toLowerCase(),rows=all.filter(x=>`${x.workflow} ${x.name} ${x.kind}`.toLowerCase().includes(q));$('checkSummary').textContent=t('summary')(all.length,all.filter(x=>x.probabilistic).length);$('tbody').innerHTML=rows.slice(0,500).map(x=>`<tr><td><span class="pill ${x.probabilistic?'down':'healthy'}">${esc(x.probabilistic?t('probState'):t('normalState'))}</span></td><td>${esc(x.kind==='workflow'?t('workflow'):t('job'))}</td><td>${esc(x.workflow||'—')}</td><td><code>${esc(x.name||'—')}</code></td><td>${x.samples_30d??0}</td><td>${pct(x.pass_rate_30d)}</td><td>${esc(reason(x))}</td></tr>`).join('')}
function render(){i18n();const hours=[...(H?.hours||[])].sort((a,b)=>a.hour.localeCompare(b.hour));renderCurrent(hours);renderToday(hours);renderTimeline(hours);renderIncidents(hours);renderChecks();$('updated').textContent=`${t('updated')}: ${H?.updated_at?fmt(H.updated_at):'—'}`}
async function load(){try{const s=Date.now();[H,T]=await Promise.all([fetch(`data/history.json?t=${s}`).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),fetch(`data/tests.json?t=${s}`).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})]);$('error').style.display='none';render()}catch(e){console.error(e);$('error').textContent=t('loadError');$('error').style.display='block'}}
$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('lang',lang);render()};$('search').oninput=renderChecks;i18n();load();
</script>
</body>
</html>
