name: Deploy CI Monitor Pages

on:
  workflow_run:
    workflows: ["Monitor vLLM-Ascend CI", "Backfill CI availability history"]
    types: [completed]
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "calendar.js"
      - "blockers.js"
      - "data/history.json"
      - "data/tests.json"
      - "data/calendar.json"
      - "data/summary.json"
      - "data/blockers.json"
      - "data/days/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest monitor data
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build static site artifact
        run: |
          rm -rf _site
          mkdir -p _site/data/days
          cp index.html calendar.js blockers.js _site/
          cp data/history.json data/tests.json _site/data/
          cp data/calendar.json data/summary.json _site/data/ 2>/dev/null || true
          cp data/blockers.json _site/data/ 2>/dev/null || true
          cp data/days/*.json _site/data/days/ 2>/dev/null || true
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
