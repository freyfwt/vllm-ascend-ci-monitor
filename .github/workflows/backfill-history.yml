name: Backfill CI availability history

# Initial archive: 2026-08-01 onward, including same-commit flaky detection inside each historical chunk.
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/backfill-history.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  BACKFILL_START: "2026-08-01"
  BACKFILL_END: "2026-08-27"

concurrency:
  group: vllm-ascend-ci-backfill
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: python
        run: |
          import json, os
          from datetime import date, timedelta
          start = date.fromisoformat(os.environ['BACKFILL_START'])
          end = date.fromisoformat(os.environ['BACKFILL_END'])
          rows = []
          cur = start
          while cur <= end:
              for hour in (0, 12):
                  rows.append({'date': cur.isoformat(), 'start_hour': hour})
              cur += timedelta(days=1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps({'include': rows}, separators=(',', ':')) + '\n')
          print(f'planned {len(rows)} chunks')

  analyze:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Analyze historical 12-hour chunk
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_GITHUB_TOKEN: ${{ secrets.UPSTREAM_GITHUB_TOKEN }}
        run: |
          mkdir -p _chunk
          python3 scripts/backfill_chunk.py \
            --date "${{ matrix.date }}" \
            --start-hour "${{ matrix.start_hour }}" \
            --hours 12 \
            --output "_chunk/${{ matrix.date }}-${{ matrix.start_hour }}.json"
      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.date }}-${{ matrix.start_hour }}
          path: _chunk/*.json
          retention-days: 2

  merge:
    needs: analyze
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download completed chunks
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: _backfill
          merge-multiple: true
      - name: Merge historical hours and build daily archive
        run: |
          python3 scripts/merge_backfill.py _backfill
          python3 scripts/rebuild_daily.py
      - name: Persist backfilled archive safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/merge_backfill.py _backfill
            python3 scripts/rebuild_daily.py
            git add data/
            if git diff --cached --quiet; then
              echo "No backfill changes."
              exit 0
            fi
            git commit -m "data: backfill CI availability from 2026-08-01"
            if git push; then
              exit 0
            fi
            echo "Push raced with another data update; retrying merge ($attempt/3)."
          done
          exit 1
