name: Monitor vLLM-Ascend CI

# Policy v9 steady state: code/test regressions are valid CI verdicts; infrastructure/reliability failures drive availability.
on:
  schedule:
    # Avoid the top-of-hour GitHub Actions scheduling rush.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/collect.py"
      - "README.md"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

concurrency:
  group: vllm-ascend-ci-monitor
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitor repository
        uses: actions/checkout@v4

      - name: Collect public vLLM-Ascend CI data
        env:
          # GITHUB_TOKEN is attempted for the public upstream API. If GitHub
          # rejects cross-repository authenticated reads, the collector
          # automatically falls back to anonymous public access.
          GITHUB_TOKEN: ${{ github.token }}
          # Optional higher-capacity token. Not required for normal operation.
          UPSTREAM_GITHUB_TOKEN: ${{ secrets.UPSTREAM_GITHUB_TOKEN }}
        run: python3 scripts/collect.py

      - name: Persist monitoring data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/tests.json data/state.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update hourly CI observation"
            git push
          fi
