name: Monitor vLLM-Ascend CI

# Policy v9: code/test regressions are valid CI verdicts; infrastructure/reliability failures drive availability.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/collect.py"
      - "scripts/rebuild_daily.py"
      - "scripts/analyze_blockers.py"
      - "README.md"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

concurrency:
  group: vllm-ascend-ci-monitor
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitor repository
        uses: actions/checkout@v4

      - name: Collect public vLLM-Ascend CI data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_GITHUB_TOKEN: ${{ secrets.UPSTREAM_GITHUB_TOKEN }}
        run: python3 scripts/collect.py

      - name: Rebuild persistent daily availability
        run: python3 scripts/rebuild_daily.py

      - name: Analyze current main-branch blockers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_GITHUB_TOKEN: ${{ secrets.UPSTREAM_GITHUB_TOKEN }}
          AUTH_REQUEST_BUDGET: "2600"
        run: python3 scripts/analyze_blockers.py

      - name: Persist monitoring data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update hourly CI availability and blockers"
            git fetch origin main
            git rebase origin/main
            git push
          fi
