name: Monitor vLLM-Ascend CI

# Availability answers one question: can a normal PR obtain a reliable required ci-gate verdict?
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/collect.py"
      - "scripts/classify_merge_availability.py"
      - "scripts/run_merge_availability.py"
      - "scripts/reapply_merge_status.py"
      - "scripts/rebuild_daily.py"
      - "README.md"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

concurrency:
  group: vllm-ascend-ci-monitor-merge-gate
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitor repository
        uses: actions/checkout@v4

      - name: Collect public vLLM-Ascend CI data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_GITHUB_TOKEN: ${{ secrets.UPSTREAM_GITHUB_TOKEN }}
        run: python3 scripts/collect.py

      - name: Classify PR merge-gate availability
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_GITHUB_TOKEN: ${{ secrets.UPSTREAM_GITHUB_TOKEN }}
          MERGE_AVAILABILITY_LOOKBACK_HOURS: "12"
          MERGE_GATE_LOG_CAP: "10"
          MERGE_GATE_LOG_TIMEOUT: "8"
        run: python3 scripts/run_merge_availability.py

      - name: Reapply merge-gate status to all retained history
        run: python3 scripts/reapply_merge_status.py

      - name: Rebuild persistent daily availability
        run: python3 scripts/rebuild_daily.py

      - name: Persist monitoring data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/tests.json data/state.json data/calendar.json data/summary.json data/days/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update hourly CI availability"
            git fetch origin main
            git rebase origin/main
            git push
          fi