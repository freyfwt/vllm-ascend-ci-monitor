name: Apply CI availability policy update

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-policy-update.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply staged files
        run: |
          python3 .update/apply.py
          python3 -m py_compile scripts/collect.py

      - name: Commit final files and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/collect.py index.html README.md
          git rm -r .update .github/workflows/apply-policy-update.yml
          git commit -m "feat: distinguish CI infrastructure from code failures"
          git push
