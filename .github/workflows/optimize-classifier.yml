name: Optimize CI failure classifier

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/optimize-classifier.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply classifier optimization
        run: |
          python3 .update/optimize_classifier.py
          python3 -m py_compile scripts/collect.py
      - name: Commit and clean updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/collect.py
          git rm .update/optimize_classifier.py .github/workflows/optimize-classifier.yml
          git commit -m "perf: inspect logs only for ambiguous CI failures"
          git push
