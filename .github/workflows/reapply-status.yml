name: Reapply merge-gate status

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/reapply-status.yml"

permissions:
  contents: write

concurrency:
  group: vllm-ascend-ci-reapply-status
  cancel-in-progress: true

jobs:
  reapply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest monitor repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reapply status and rebuild calendar
        run: |
          python3 scripts/reapply_merge_status.py
          python3 scripts/rebuild_daily.py

      - name: Persist recolored data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/calendar.json data/summary.json data/days/
          if git diff --cached --quiet; then
            echo "No status changes."
            exit 0
          fi
          git commit -m "data: reapply merge-gate status"
          git pull --rebase origin main
          git push
