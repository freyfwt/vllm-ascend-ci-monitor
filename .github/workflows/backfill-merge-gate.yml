name: Backfill PR merge-gate availability

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/backfill_merge_gate_chunk.py"
      - "scripts/merge_merge_gate_backfill.py"
      - "scripts/classify_merge_availability.py"
      - "scripts/run_merge_availability.py"
      - "scripts/reapply_merge_status.py"
      - "scripts/collect.py"
      - ".github/workflows/backfill-merge-gate.yml"

permissions:
  contents: write

concurrency:
  group: vllm-ascend-ci-merge-gate-recent7
  cancel-in-progress: true

env:
  TRACKING_START: "2026-08-01"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.matrix.outputs.windows }}
    steps:
      - id: matrix
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timedelta, timezone

          # Keep historical replay bounded and reliable. The live monitor owns
          # the current UTC day; replay only the seven fully completed days.
          today = datetime.now(timezone.utc).replace(hour=0, minute=0, second=0, microsecond=0)
          start = today - timedelta(days=7)
          windows = []
          cur = start
          while cur < today:
              windows.append({
                  "start": cur.isoformat().replace("+00:00", "Z"),
                  "key": cur.strftime("%Y-%m-%d-%H"),
              })
              cur += timedelta(hours=4)
          print("windows=" + json.dumps(windows, separators=(",", ":")))
          PY

  chunk:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        window: ${{ fromJSON(needs.prepare.outputs.windows) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitor repository
        uses: actions/checkout@v4

      - name: Replay E2E merge gate for ${{ matrix.window.start }}
        env:
          # Prefer a user-provided public-repo read token when configured.
          # Otherwise the analyzer intentionally falls back to bounded public API access.
          UPSTREAM_GITHUB_TOKEN: ${{ secrets.UPSTREAM_GITHUB_TOKEN }}
          AUTH_REQUEST_BUDGET: "900"
          ANON_REQUEST_BUDGET: "54"
          # Historical replay must stay lightweight: Jobs/steps/annotations only.
          # Full job logs remain available for targeted interactive investigation.
          MERGE_GATE_LOG_CAP: "0"
          MERGE_GATE_LOG_TIMEOUT: "4"
        run: |
          mkdir -p data/merge_gate_backfill
          python3 scripts/backfill_merge_gate_chunk.py \
            --start "${{ matrix.window.start }}" \
            --hours 4 \
            --out "data/merge_gate_backfill/${{ matrix.window.key }}.json"

      - name: Upload window result
        uses: actions/upload-artifact@v4
        with:
          name: merge-gate-${{ matrix.window.key }}
          path: data/merge_gate_backfill/${{ matrix.window.key }}.json
          retention-days: 2

  merge:
    needs: [prepare, chunk]
    if: ${{ always() && needs.chunk.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest monitor repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download all window results
        uses: actions/download-artifact@v4
        with:
          pattern: merge-gate-*
          path: data/merge_gate_backfill
          merge-multiple: true

      - name: Merge into latest history and rebuild calendar
        run: |
          git pull --rebase origin main
          python3 scripts/merge_merge_gate_backfill.py --dir data/merge_gate_backfill
          python3 scripts/rebuild_daily.py

      - name: Persist merge-gate history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/calendar.json data/summary.json data/days/
          if git diff --cached --quiet; then
            echo "No merge-gate backfill changes."
            exit 0
          fi
          git commit -m "data: backfill recent PR merge-gate availability"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin main
            python3 scripts/merge_merge_gate_backfill.py --dir data/merge_gate_backfill
            python3 scripts/rebuild_daily.py
            git add data/history.json data/calendar.json data/summary.json data/days/
            git commit -m "data: backfill recent PR merge-gate availability"
          done
          exit 1
